name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew clean test --no-daemon
      - name: Build
        run: ./gradlew clean build --no-daemon
      - name: Boot jar
        run: ./gradlew bootJar --no-daemon
      - name: Gradle deprecation check
        run: ./gradlew build --warning-mode all --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests
            backend/build/test-results
            backend/build/reports/problems
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  analysis-engine:
    name: Analysis Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis-engine
    env:
      STT_PROVIDER: NONE
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis-engine/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libgomp1
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify imports
        run: python -c "import cv2, mediapipe; from app.main import app; assert app"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile application
        run: python -m compileall -q app
      - name: Health smoke test
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/analysis-engine.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/analysis-engine.log
          exit 1

  video-llm-engine:
    name: Video LLM Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: video-llm-engine
    env:
      VIDEO_LLM_PROVIDER: NONE
      VIDEO_LLM_FALLBACK_PROVIDER: NONE
      NVIDIA_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-llm-engine/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify imports
        run: python -c "from app.main import app; assert app"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile application
        run: python -m compileall -q app
      - name: Health smoke test
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8002 > /tmp/video-llm-engine.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8002/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/video-llm-engine.log
          exit 1

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          mkdir -p /tmp/presentation-coaching-ci-storage
          docker compose \
            --env-file infra/docker/.env.ci.example \
            -f infra/docker/docker-compose.yml \
            config --quiet
