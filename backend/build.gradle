// 역할: 백엔드 빌드 의존성, 플러그인, Java/Spring 설정을 정의합니다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.hanium'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core:11.20.2'
    implementation 'org.flywaydb:flyway-mysql:11.20.2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def safeTestRuntimeRoot = providers.provider {
    def configuredPath = providers.environmentVariable('BACKEND_TEST_RUNTIME_DIR').orNull
    if (configuredPath != null && !configuredPath.isBlank()) {
        return file(configuredPath)
    }
    return new File(System.getProperty('java.io.tmpdir'), "${rootProject.name}-test-runtime")
}

tasks.register('syncTestRuntimeClasspath', Sync) {
    dependsOn tasks.named('testClasses')

    into safeTestRuntimeRoot
    from(sourceSets.main.output) {
        into 'main'
    }
    from(sourceSets.test.output) {
        into 'test'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn tasks.named('syncTestRuntimeClasspath')

    def safeMainOutput = safeTestRuntimeRoot.map { new File(it, 'main') }
    def safeTestOutput = safeTestRuntimeRoot.map { new File(it, 'test') }

    testClassesDirs = files(safeTestOutput)
    classpath = files(safeTestOutput, safeMainOutput) + configurations.testRuntimeClasspath
}

tasks.named('clean') {
    delete safeTestRuntimeRoot
}
