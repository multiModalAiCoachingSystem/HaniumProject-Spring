# 역할: Spring Boot 실행 환경, DB, 외부 엔진 URL 같은 공통 설정을 정의합니다.
spring:
  application:
    name: presentation-coaching-ai
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:presentation_coaching_ai}?connectionTimeZone=${APP_TIME_ZONE:Asia/Seoul}&characterEncoding=UTF-8
    username: ${DB_USERNAME:presentation}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: ${APP_TIME_ZONE:Asia/Seoul}
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Seoul}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    validate-on-migrate: true
    clean-disabled: true

app:
  security:
    environment: ${APP_ENV:development}
    base-url: ${APP_BASE_URL:http://localhost}
    frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://localhost}
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
    rate-limit:
      login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
      register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}
      refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:20}
      upload-per-hour: ${RATE_LIMIT_UPLOAD_PER_HOUR:20}
      analysis-per-hour: ${RATE_LIMIT_ANALYSIS_PER_HOUR:20}
      retry-per-hour: ${RATE_LIMIT_RETRY_PER_HOUR:10}
      admin-per-minute: ${RATE_LIMIT_ADMIN_PER_MINUTE:60}
      api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:120}
  storage:
    root: ${STORAGE_ROOT:/app/storage}
  video:
    min-duration-seconds: ${VIDEO_MIN_DURATION_SECONDS:5}
    max-duration-seconds: ${VIDEO_MAX_DURATION_SECONDS:600}
  analysis-engine:
    base-url: ${ANALYSIS_ENGINE_BASE_URL:http://localhost:8001}
  analysis-recovery:
    max-attempts: ${ANALYSIS_RECOVERY_MAX_ATTEMPTS:3}
  video-llm-engine:
    base-url: ${VIDEO_LLM_ENGINE_BASE_URL:http://localhost:8002}
  text-llm:
    provider: ${TEXT_LLM_PROVIDER:OLLAMA}
    base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
    model: ${TEXT_LLM_MODEL:qwen3:4b}
    timeout-seconds: ${TEXT_LLM_TIMEOUT_SECONDS:30}
