# 기본 compose와 함께 사용하는 운영 HTTPS override입니다.
services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ../nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE_PATH:?Set TLS_CERTIFICATE_PATH in infra/docker/.env}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:?Set TLS_PRIVATE_KEY_PATH in infra/docker/.env}:/etc/nginx/tls/privkey.pem:ro
