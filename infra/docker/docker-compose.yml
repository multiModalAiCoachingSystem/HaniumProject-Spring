# 역할: MySQL, 백엔드, 프론트엔드, 분석 엔진, nginx를 함께 실행하는 로컬 배포 구성입니다.
x-storage-bind: &storage-bind
  type: bind
  source: ${HOST_STORAGE_PATH:?Set HOST_STORAGE_PATH in infra/docker/.env}
  target: /app/storage
  bind:
    create_host_path: false

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  analysis-engine:
    build:
      context: ../../analysis-engine
      dockerfile: ../infra/docker/analysis-engine.Dockerfile
    environment:
      STORAGE_ROOT: ${STORAGE_ROOT:?Set STORAGE_ROOT in infra/docker/.env}
      STT_PROVIDER: ${STT_PROVIDER}
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_DEVICE: ${WHISPER_DEVICE}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE}
      STT_LANGUAGE: ${STT_LANGUAGE}
      HF_HOME: ${HF_HOME:?Set HF_HOME in infra/docker/.env}
    volumes:
      - *storage-bind
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  video-llm-engine:
    build:
      context: ../../video-llm-engine
      dockerfile: ../infra/docker/video-llm-engine.Dockerfile
    environment:
      STORAGE_ROOT: ${STORAGE_ROOT:?Set STORAGE_ROOT in infra/docker/.env}
      VIDEO_LLM_PROVIDER: ${VIDEO_LLM_PROVIDER}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      TEXT_LLM_PROVIDER: ${TEXT_LLM_PROVIDER}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL}
      VIDEO_LLM_MODEL: ${VIDEO_LLM_MODEL}
    volumes:
      - *storage-bind

  backend:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      STORAGE_ROOT: ${STORAGE_ROOT:?Set STORAGE_ROOT in infra/docker/.env}
      ANALYSIS_ENGINE_BASE_URL: ${ANALYSIS_ENGINE_BASE_URL}
      VIDEO_LLM_ENGINE_BASE_URL: ${VIDEO_LLM_ENGINE_BASE_URL}
      TEXT_LLM_PROVIDER: ${TEXT_LLM_PROVIDER}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL}
      TEXT_LLM_TIMEOUT_SECONDS: ${TEXT_LLM_TIMEOUT_SECONDS}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - *storage-bind
    depends_on:
      mysql:
        condition: service_healthy
      analysis-engine:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql-data:
