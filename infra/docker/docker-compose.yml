# 역할: MySQL, 백엔드, 프론트엔드, 분석 엔진, nginx를 함께 실행하는 로컬 배포 구성입니다.
x-storage-bind: &storage-bind
  type: bind
  source: ${HOST_STORAGE_PATH:?Set HOST_STORAGE_PATH in infra/docker/.env}
  target: /app/storage
  bind:
    create_host_path: false

services:
  mysql:
    image: mysql:8.4
    command: ["--default-time-zone=+09:00"]
    environment:
      TZ: ${APP_TIME_ZONE:-Asia/Seoul}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  analysis-engine:
    build:
      context: ../../analysis-engine
      dockerfile: ../infra/docker/analysis-engine.Dockerfile
    environment:
      STORAGE_ROOT: ${STORAGE_ROOT:?Set STORAGE_ROOT in infra/docker/.env}
      STT_PROVIDER: ${STT_PROVIDER}
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_DEVICE: ${WHISPER_DEVICE}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE}
      STT_LANGUAGE: ${STT_LANGUAGE}
      HF_HOME: ${HF_HOME:?Set HF_HOME in infra/docker/.env}
      FACE_DETECTION_CONFIDENCE: ${FACE_DETECTION_CONFIDENCE:-0.3}
      FACE_TRACKING_CONFIDENCE: ${FACE_TRACKING_CONFIDENCE:-0.3}
      FACE_ANALYSIS_MAX_WIDTH: ${FACE_ANALYSIS_MAX_WIDTH:-1280}
      FACE_CROP_RETRY_ENABLED: ${FACE_CROP_RETRY_ENABLED:-true}
      FACE_CROP_PADDING_RATIO: ${FACE_CROP_PADDING_RATIO:-0.25}
      FACE_CROP_MIN_SIZE: ${FACE_CROP_MIN_SIZE:-256}
      AUDIO_VAD_PROVIDER: ${AUDIO_VAD_PROVIDER:-RMS}
      AUDIO_VAD_FALLBACK_PROVIDER: ${AUDIO_VAD_FALLBACK_PROVIDER:-RMS}
      VAD_MIN_SPEECH_MS: ${VAD_MIN_SPEECH_MS:-250}
      VAD_MIN_SILENCE_MS: ${VAD_MIN_SILENCE_MS:-350}
      VAD_SPEECH_PAD_MS: ${VAD_SPEECH_PAD_MS:-100}
      VAD_MERGE_GAP_MS: ${VAD_MERGE_GAP_MS:-200}
      SILERO_VAD_THRESHOLD: ${SILERO_VAD_THRESHOLD:-0.5}
      SILERO_VAD_MODEL_PATH: ${SILERO_VAD_MODEL_PATH:-}
    volumes:
      - *storage-bind
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  video-llm-engine:
    build:
      context: ../../video-llm-engine
      dockerfile: ../infra/docker/video-llm-engine.Dockerfile
    environment:
      STORAGE_ROOT: ${STORAGE_ROOT:?Set STORAGE_ROOT in infra/docker/.env}
      VIDEO_LLM_PROVIDER: ${VIDEO_LLM_PROVIDER}
      VIDEO_LLM_FALLBACK_PROVIDER: ${VIDEO_LLM_FALLBACK_PROVIDER}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      TEXT_LLM_PROVIDER: ${TEXT_LLM_PROVIDER}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL}
      VIDEO_LLM_MODEL: ${VIDEO_LLM_MODEL}
      OLLAMA_VIDEO_LLM_MODEL: ${OLLAMA_VIDEO_LLM_MODEL}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_REQUEST_TIMEOUT_SECONDS: ${NVIDIA_REQUEST_TIMEOUT_SECONDS}
      NVIDIA_MAX_TOKENS: ${NVIDIA_MAX_TOKENS}
      NVIDIA_TEMPERATURE: ${NVIDIA_TEMPERATURE}
      NVIDIA_TOP_P: ${NVIDIA_TOP_P}
      NVIDIA_MAX_IMAGES: ${NVIDIA_MAX_IMAGES}
      NVIDIA_MAX_PAYLOAD_MB: ${NVIDIA_MAX_PAYLOAD_MB}
    volumes:
      - *storage-bind

  backend:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment:
      TZ: ${APP_TIME_ZONE:-Asia/Seoul}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${APP_TIME_ZONE:-Asia/Seoul}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Seoul}
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_REGISTER_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_HOUR:-5}
      RATE_LIMIT_REFRESH_PER_MINUTE: ${RATE_LIMIT_REFRESH_PER_MINUTE:-20}
      RATE_LIMIT_UPLOAD_PER_HOUR: ${RATE_LIMIT_UPLOAD_PER_HOUR:-20}
      RATE_LIMIT_ANALYSIS_PER_HOUR: ${RATE_LIMIT_ANALYSIS_PER_HOUR:-20}
      RATE_LIMIT_RETRY_PER_HOUR: ${RATE_LIMIT_RETRY_PER_HOUR:-10}
      RATE_LIMIT_ADMIN_PER_MINUTE: ${RATE_LIMIT_ADMIN_PER_MINUTE:-60}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-120}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-1}
      STORAGE_ROOT: ${STORAGE_ROOT:?Set STORAGE_ROOT in infra/docker/.env}
      ANALYSIS_ENGINE_BASE_URL: ${ANALYSIS_ENGINE_BASE_URL}
      ANALYSIS_RECOVERY_MAX_ATTEMPTS: ${ANALYSIS_RECOVERY_MAX_ATTEMPTS:-3}
      VIDEO_LLM_ENGINE_BASE_URL: ${VIDEO_LLM_ENGINE_BASE_URL}
      TEXT_LLM_PROVIDER: ${TEXT_LLM_PROVIDER}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL}
      TEXT_LLM_TIMEOUT_SECONDS: ${TEXT_LLM_TIMEOUT_SECONDS}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - *storage-bind
    depends_on:
      mysql:
        condition: service_healthy
      analysis-engine:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql-data:
