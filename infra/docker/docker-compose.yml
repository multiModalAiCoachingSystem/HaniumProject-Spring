# 역할: MySQL, 백엔드, 프론트엔드, 분석 엔진, nginx를 함께 실행하는 로컬 배포 구성입니다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: presentation_coaching_ai
      MYSQL_USER: presentation
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  analysis-engine:
    build:
      context: ../../analysis-engine
      dockerfile: ../infra/docker/analysis-engine.Dockerfile
    environment:
      STORAGE_ROOT: /data
      STT_PROVIDER: FASTER_WHISPER
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      STT_LANGUAGE: ko
      HF_HOME: /data/models/huggingface
    volumes:
      - "${HOST_STORAGE_PATH:-D:/presentation-coaching-ai/storage}:/data"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  video-llm-engine:
    build:
      context: ../../video-llm-engine
      dockerfile: ../infra/docker/video-llm-engine.Dockerfile
    environment:
      STORAGE_ROOT: /data
      VIDEO_LLM_PROVIDER: OLLAMA
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      TEXT_LLM_MODEL: qwen3:4b
      VIDEO_LLM_MODEL: qwen3-vl:4b
    volumes:
      - "${HOST_STORAGE_PATH:-D:/presentation-coaching-ai/storage}:/data"

  backend:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: presentation_coaching_ai
      DB_USERNAME: presentation
      DB_PASSWORD: ${DB_PASSWORD}
      STORAGE_ROOT: /data
      ANALYSIS_ENGINE_BASE_URL: http://analysis-engine:8001
      VIDEO_LLM_ENGINE_BASE_URL: http://video-llm-engine:8002
      TEXT_LLM_PROVIDER: OLLAMA
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      TEXT_LLM_MODEL: qwen3:4b
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - "${HOST_STORAGE_PATH:-D:/presentation-coaching-ai/storage}:/data"
    depends_on:
      mysql:
        condition: service_healthy
      analysis-engine:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql-data:
